# Build, scan with Trivy, push to GHCR, sign with cosign and smoke-test
# the blamepost container on every `v*` tag. The order is lint, build,
# scan, push, sign, smoke, which means a vulnerable image never lands
# in the registry, and a published image is always cosign-signed and
# proven to reach its own healthcheck.
#
# Two Trivy steps:
#   1. Visibility (exit 0): every severity plus secrets and
#      misconfiguration, including unfixed CVEs. It is informational
#      and serves as the fix list for the next patch release.
#   2. Gate (exit 1): fails the release on CRITICAL/HIGH findings that
#      have a fix available. The narrow threshold avoids blocking on
#      unpatched upstream CVEs while still refusing to ship an image
#      with an actionable high-severity issue.
#
# `workflow_dispatch.dry_run` exercises build + scan without pushing or
# signing, which is useful for verifying a Dockerfile change before
# tagging.

name: Release container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and scan without pushing to the registry or signing'
        type: boolean
        default: true

# Workflow-level is read-only; the publish job elevates for the GHCR
# push and cosign keyless signing. Lint and smoke stay read-only.
permissions:
  contents: read

concurrency:
  group: release-container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE:    ghcr.io/${{ github.repository_owner }}/blamepost

jobs:
  # ---- Lint gate ----------------------------------------------------
  # Runs on every release tag before the container build starts. A
  # tag-time lint regression must never publish a container.
  lint-eslint:
    name: ESLint (lib + bin + scripts + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24.19.0 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Install devDependencies (lockfile-pinned)
        run: npm ci --no-audit --no-fund
      - name: Run ESLint (max-warnings 0)
        run: npx --no-install eslint --max-warnings 0 .

  lint-hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run Hadolint (strict, all severities)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile
          config:     .hadolint.yaml
          format:     tty
          no-fail:    false
          failure-threshold: warning

  lint-shellcheck:
    name: ShellCheck (shell scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Detect shell scripts
        id: sh
        run: |
          count=$(git ls-files '*.sh' | wc -l)
          echo "Tracked .sh files: $count"
          git ls-files '*.sh' || true
          echo "found=$count" >> "$GITHUB_OUTPUT"
      - name: Run ShellCheck
        if: steps.sh.outputs.found != '0'
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          severity: style
          format:   tty
          check_together: 'yes'

  publish:
    name: Build, scan, publish
    needs: [lint-eslint, lint-hadolint, lint-shellcheck]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # GHCR multi-arch push
      id-token: write   # cosign keyless signing via GitHub OIDC
    outputs:
      digest:  ${{ steps.push.outputs.digest }}
      version: ${{ steps.tags.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (for the ARM64 cross-build)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          # On workflow_dispatch there is no tag, so fall back to a
          # sha-based scan tag: the local build + Trivy scan path still
          # works, and nothing is pushed.
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            REF="${GITHUB_REF#refs/tags/v}"
            MAJOR_MINOR="${REF%.*}"
            {
              echo "semver=$REF"
              echo "minor=$MAJOR_MINOR"
              echo "scan_tag=$REF"
              echo "is_tag=true"
            } >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            {
              echo "semver=0.0.0-dev-${SHORT_SHA}"
              echo "minor=0.0"
              echo "scan_tag=dev-${SHORT_SHA}"
              echo "is_tag=false"
            } >> "$GITHUB_OUTPUT"
          fi

      # Resolve the rolling base tags to concrete digests ONCE and feed
      # them to both the local Trivy build and the multi-arch push via
      # build-args, overriding the digests committed in the Dockerfile.
      # The scanned image is then the published one. No window exists
      # for a base to move between two separate builds, and the arm64
      # variant comes from the same index Trivy read. The digests stay
      # fresh at the same time, so the published image carries current
      # CVE patches. The committed defaults keep a plain `docker build`
      # reproducible.
      - name: Resolve base image digests (scan == publish)
        id: bases
        run: |
          set -euo pipefail
          src=$(docker buildx imagetools inspect cgr.dev/chainguard/node:latest-dev --format '{{.Manifest.Digest}}')
          runtime=$(docker buildx imagetools inspect cgr.dev/chainguard/node:latest --format '{{.Manifest.Digest}}')
          # Fail closed on a missing or malformed digest. An empty or
          # garbage value would flow into the build-arg and silently
          # produce an unpinned base, so the scanned image would not
          # equal the published one.
          if ! printf '%s' "$src" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not resolve a valid sha256 digest for the source-stage base (got '${src}')"
            exit 1
          fi
          if ! printf '%s' "$runtime" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not resolve a valid sha256 digest for the runtime base (got '${runtime}')"
            exit 1
          fi
          echo "src=cgr.dev/chainguard/node:latest-dev@${src}" >> "$GITHUB_OUTPUT"
          echo "runtime=cgr.dev/chainguard/node:latest@${runtime}" >> "$GITHUB_OUTPUT"
          echo "Resolved src=${src}, runtime=${runtime}"

      # Build into the local Docker daemon (load: true) so Trivy can
      # scan it. The push happens only after both Trivy steps pass.
      # `load: true` forces a single architecture; the multi-arch build
      # is the post-scan push step below.
      - name: Build (local-only, for Trivy)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            BASE_SRC=${{ steps.bases.outputs.src }}
            BASE_RUNTIME=${{ steps.bases.outputs.runtime }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.scan_tag }}

      - name: Trivy scan for visibility, all severities, no fail
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tags.outputs.scan_tag }}
          severity:  'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          scanners:  'vuln,secret,misconfig'
          ignore-unfixed: false
          format:    'table'

      - name: Trivy scan release gate, CRITICAL and HIGH with a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref:      ${{ env.IMAGE }}:${{ steps.tags.outputs.scan_tag }}
          severity:       'CRITICAL,HIGH'
          exit-code:      '1'
          ignore-unfixed: true
          format:         'table'

      - name: Install cosign
        if: ${{ !inputs.dry_run && steps.tags.outputs.is_tag == 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Reached only when both Trivy steps pass. The multi-arch build
      # happens here rather than reusing the single-arch `load: true`
      # build because buildx cannot load a multi-arch manifest into the
      # local daemon, so it goes straight to the registry.
      - name: Push (multi-arch, after the Trivy gate)
        id: push
        if: ${{ !inputs.dry_run && steps.tags.outputs.is_tag == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            BASE_SRC=${{ steps.bases.outputs.src }}
            BASE_RUNTIME=${{ steps.bases.outputs.runtime }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.semver }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.minor }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=blamepost
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.semver }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Self-hosted mail server that owns its stack: SMTP, IMAP, JMAP, POP3, ManageSieve and webmail in one container. PQC-first, zero runtime deps.
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Sign the image with cosign (keyless, GitHub OIDC)
        if: ${{ !inputs.dry_run && steps.tags.outputs.is_tag == 'true' && steps.push.outputs.digest }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate the SHA3-512 digest
        # The PQC-first byte digest matching the rest of the release
        # chain's hash choice. Verify with `openssl dgst -sha3-512`
        # against `docker save` output.
        if: ${{ !inputs.dry_run && steps.tags.outputs.is_tag == 'true' && steps.push.outputs.digest }}
        id: sha3
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}@${DIGEST}"
          HASH=$(docker save "${IMAGE}@${DIGEST}" | openssl dgst -sha3-512 | awk '{print $NF}')
          echo "SHA3-512: $HASH"
          echo "sha3=$HASH" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "#### SHA3-512"
            echo '```'
            echo "$HASH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build summary
        if: always()
        env:
          DRY_RUN:  ${{ inputs.dry_run || 'false' }}
          IS_TAG:   ${{ steps.tags.outputs.is_tag }}
          VERSION:  ${{ steps.tags.outputs.semver }}
          TAGS_LIST: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.semver }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.minor }}
            ${{ env.IMAGE }}:latest
        run: |
          {
            echo "### Container release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version**   | ${VERSION} |"
            echo "| **Platforms** | linux/amd64, linux/arm64 |"
            echo "| **Registry**  | ${IMAGE} |"
            echo "| **Commit**    | ${GITHUB_SHA} |"
            echo "| **Dry run**   | ${DRY_RUN} |"
            echo "| **Tag push**  | ${IS_TAG} |"
            echo ""
            echo "#### Tags"
            echo '```'
            printf '%s\n' "$TAGS_LIST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- Post-publish smoke -------------------------------------------
  # Pulls the published image by digest, verifies the OCI labels, starts
  # it with the documented hardened flags and waits for the container's
  # own HEALTHCHECK to report healthy. Skipped on a dry run.
  smoke-test:
    name: Post-publish smoke test
    needs: publish
    if: ${{ !inputs.dry_run && needs.publish.outputs.digest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Hoisted so `run:` blocks reference $DIGEST instead of inlining
      # the expression, keeping GitHub-context values out of
      # shell-parsed text.
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      # This job runs on a fresh runner and does not inherit the publish
      # job's GHCR auth. Logging in first makes `docker pull` work
      # whether the package is public or private; against a public
      # package the login is a no-op.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published image
        run: docker pull "${IMAGE}@${DIGEST}"

      - name: Verify the OCI labels
        run: |
          set -euo pipefail
          LABELS=$(docker inspect "${IMAGE}@${DIGEST}" --format '{{json .Config.Labels}}')
          echo "$LABELS" | python3 -m json.tool
          echo "$LABELS" | python3 -c "
          import sys, json
          d = json.load(sys.stdin) or {}
          required = [
            'org.opencontainers.image.title',
            'org.opencontainers.image.source',
            'org.opencontainers.image.licenses',
            'org.opencontainers.image.version',
          ]
          missing = [k for k in required if k not in d]
          assert not missing, 'missing labels: ' + ', '.join(missing)
          print('Labels OK: title=' + d['org.opencontainers.image.title'] + ', license=' + d['org.opencontainers.image.licenses'] + ', version=' + d['org.opencontainers.image.version'])
          "

      - name: Assert the image declares a HEALTHCHECK
        # The healthcheck is the container's liveness contract. Compose,
        # orchestrators and `docker ps` all read it. An image declaring
        # none reports healthy forever, so refuse rather than smoke-test
        # a container whose health is unknowable.
        run: |
          set -euo pipefail
          DECLARED=$(docker inspect "${IMAGE}@${DIGEST}" --format '{{if .Config.Healthcheck}}yes{{else}}no{{end}}')
          if [ "$DECLARED" != "yes" ]; then
            echo "::error::The published image declares no HEALTHCHECK."
            exit 1
          fi
          docker inspect "${IMAGE}@${DIGEST}" --format '{{json .Config.Healthcheck}}'

      - name: Start the container
        # The run posture is the documented one: every Linux capability
        # dropped and none added back, with the unprivileged port floor
        # lowered inside the container's own network namespace so the MX,
        # submission, IMAP and ManageSieve listeners take their ports.
        # That sysctl is namespaced and changes nothing on the runner. It
        # is what compose.yml sets and what the README runs, so a healthy
        # verdict here is a verdict on the posture an operator gets rather
        # than on a capability nothing ships with.
        #
        # The certificate is generated here rather than obtained. Every
        # listener requires TLS and none has a plaintext mode, so a
        # container with no certificate has nothing to start. A run that
        # reached a certificate authority would be testing the network
        # instead of the image.
        #
        # BLAMEPOST_DNS_ACKNOWLEDGED is set because the boot gate refuses
        # the whole listener sequence rather than the MX listener alone.
        # This image hosts no domains yet, so the per domain half of the
        # gate has nothing to wait on.
        run: |
          set -euo pipefail
          VAULT_PASSPHRASE=$(openssl rand -hex 32)
          ADMIN_PASSWORD=$(openssl rand -hex 16)
          mkdir -p "${RUNNER_TEMP}/tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj "/CN=mx.example.com" \
            -addext "subjectAltName=DNS:mx.example.com" \
            -keyout "${RUNNER_TEMP}/tls/privkey.pem" \
            -out "${RUNNER_TEMP}/tls/fullchain.pem"
          chmod 0644 "${RUNNER_TEMP}/tls/privkey.pem" "${RUNNER_TEMP}/tls/fullchain.pem"
          docker run -d --name smoke-test \
            --init \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --sysctl net.ipv4.ip_unprivileged_port_start=0 \
            -v "${RUNNER_TEMP}/tls:/etc/blamepost/tls:ro" \
            -e BLAMEPOST_HOSTNAME=mx.example.com \
            -e BLAMEPOST_VAULT_PASSPHRASE="$VAULT_PASSPHRASE" \
            -e BLAMEPOST_ADMIN_EMAIL=admin@example.com \
            -e BLAMEPOST_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e BLAMEPOST_TLS_CERT=/etc/blamepost/tls/fullchain.pem \
            -e BLAMEPOST_TLS_KEY=/etc/blamepost/tls/privkey.pem \
            -e BLAMEPOST_DNS_ACKNOWLEDGED=1 \
            -e BLAMEPOST_LOG_LEVEL=debug \
            "${IMAGE}@${DIGEST}"

      - name: Wait for the container to report healthy
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            STATUS=$(docker inspect smoke-test --format '{{.State.Health.Status}}')
            if [ "$STATUS" = "healthy" ]; then
              echo "Container reported healthy."
              exit 0
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "::error::Container healthcheck reported unhealthy."
              exit 1
            fi
            sleep 2
          done
          echo "::error::Container never left '${STATUS}' within the wait budget."
          exit 1

      - name: Capture container diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps ==="
          docker ps -a --filter name=smoke-test
          echo ""
          echo "=== docker inspect (State) ==="
          docker inspect smoke-test --format '{{json .State}}' | python3 -m json.tool 2>&1 || true
          echo ""
          echo "=== docker logs (full) ==="
          docker logs smoke-test 2>&1 || echo "  (container gone, so logs cannot be fetched)"

      - name: Smoke summary (success)
        if: success()
        run: |
          {
            echo "### Post-publish smoke"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Pull image     | passed |"
            echo "| OCI labels     | passed |"
            echo "| Healthcheck    | passed |"
            echo "| Hardened flags | passed |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke summary (failure)
        if: failure()
        run: |
          {
            echo "### Post-publish smoke failed"
            echo ""
            echo "Smoke test failed for ${IMAGE}@${DIGEST}."
            echo "See the container diagnostics step above for docker ps / inspect / logs output."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: docker rm -f smoke-test 2>/dev/null || true
