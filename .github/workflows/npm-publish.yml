# Publish @blamejs/blamepost to the npm registry on every `v*` tag push,
# and create the signed GitHub release with the full asset bundle.
#
# The workflow is authoritative for release creation. The operator
# pushes the tag; the workflow then:
#   1. Validates: version/tag match, lint, static gates, smoke, SBOMs,
#      OSV scan.
#   2. Packs the tarball (the exact bytes that will be published).
#   3. Generates SLSA L3 provenance via slsa-github-generator: a
#      *.intoto.jsonl attestation bound to this workflow run, commit and
#      tag, signed through Sigstore-keyless.
#   4. Cosign-signs both SBOMs with the workflow's OIDC identity.
#   5. Writes the digest sidecars (SHA-256 + SHA3-512) and, when the
#      release-signing key is configured, the ML-DSA-65 signature.
#   6. Creates the GitHub release ATOMICALLY with the whole asset
#      bundle, so the immutable-release setting can stay on.
#   7. Publishes to npm with --provenance attached.
#
# Operator-side release flow:
#   1. Bump the version in package.json.
#   2. Author release-notes/v<X>.<Y>.<Z>.json, fold it into the minor
#      series file release-notes/v<X>.<Y>.x.json, and rebuild
#      CHANGELOG.md. `node scripts/release.js regen` runs all three.
#   3. Commit on a release branch, open and merge the pull request.
#   4. `git tag -s vX.Y.Z -m "vX.Y.Z" && git push origin vX.Y.Z`
#   5. Confirm `npm view @blamejs/blamepost version` matches the tag.
#   There is no manual `gh release create` step.
#
# Supply-chain posture:
#   - `npm publish --provenance` attaches a SLSA v1 attestation tying
#     the published tarball to this run, commit and tag; it shows on the
#     package's Provenance tab.
#   - The GitHub release carries the same attestation as
#     `blamepost-X.Y.Z.intoto.jsonl`, verifiable with `slsa-verifier
#     verify-artifact`. SECURITY.md carries the full recipe.
#   - Both SBOMs carry independent cosign-keyless signatures.
#   - package.json "version" MUST equal the pushed tag minus the leading
#     "v"; drift fails the publish before anything is packed.
#
# `workflow_dispatch.dry_run` exercises validation and pack without
# provenance, signing, release creation or publishing.

name: npm publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + lint + smoke without publishing to npm or creating the release'
        type: boolean
        default: true

# Workflow-level is read-only; downstream jobs elevate as needed
# (contents:write for the release, id-token:write for npm provenance,
# cosign and the SLSA generator's OIDC).
permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # eslint is a devDependency, lockfile-integrity-pinned and installed
  # with `npm ci`, so no registry-resolved, unpinned code executes
  # anywhere in this pipeline. Defense in depth on top of that pin: nothing beyond
  # the lockfile set may execute in the workspace that packs the
  # published bytes, because a compromised transitive there could
  # rewrite lib/ before `npm pack` and the SLSA provenance would
  # faithfully attest the tampered tarball. So eslint runs in its own
  # job, a release gate whose compromise is confined to the lint
  # verdict, never to the tree the pack and subject hashes come from.
  lint:
    name: ESLint (isolated from the pack workspace)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24.22.1 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Install devDependencies (lockfile-pinned)
        run: npm ci --no-audit --no-fund

      - name: ESLint (max-warnings 0)
        run: npx --no-install eslint --max-warnings 0 .

  validate:
    name: Static gates, smoke, SBOM, pack
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_tag:  ${{ steps.version.outputs.is_tag }}
      hashes:  ${{ steps.subjects.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24.22.1 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Compute version + is_tag flag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            TAG_VERSION="${REF#refs/tags/v}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::package.json version ($PKG_VERSION) does not match the pushed tag (v$TAG_VERSION)"
              exit 1
            fi
            echo "package.json version $PKG_VERSION matches the pushed tag v$TAG_VERSION"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install devDependencies (lockfile-pinned)
        run: npm ci --no-audit --no-fund

      # The tag-push publish path is independent of pull-request CI, so
      # the full static-gate battery re-runs here before `npm pack`. A
      # tree that fails any of these must never be packed into the
      # published tarball. (eslint re-runs too, in the isolated `lint`
      # job this one needs.)
      - name: Codebase-patterns detectors
        run: node test/layer-0-primitives/codebase-patterns.test.js

      - name: API surface snapshot gate
        run: node scripts/check-api-snapshot.js

      - name: One spelling per word
        run: node scripts/check-spelling-consistency.js

      - name: Operator-facing prose gate (declared off, no checker on a runner)
        # This gate drives the technical-writing skill's offline checker,
        # which is a machine-local tool. Hard rule 1 is zero runtime
        # dependencies, so the repository never installs or vendors it,
        # and a hosted runner therefore has none. The gate refuses on
        # absence by design rather than skipping quietly, so run
        # unmodified here it can only ever report the tool is missing and
        # fail the publish on something no change to this repository
        # fixes.
        #
        # The declaration below is the only sanctioned way past it, and
        # it is deliberately loud: the step prints that operator-facing
        # prose was NOT checked on this run, so the publish log carries
        # the record rather than an absence nobody notices. The gate
        # itself still runs, on the maintainer's machine, before the
        # commit that becomes the release.
        #
        # Delete this env block the moment the repository provisions the
        # checker itself. Nothing else has to change for the gate to come
        # back.
        env:
          BLAMEPOST_PROSE_CHECK: "off"
        run: node scripts/check-operator-prose.js

      - name: '@status lifecycle gate'
        run: node scripts/check-status-lifecycle.js

      - name: CHANGELOG derived from the structured release notes
        run: node scripts/generate-changelog-entry.js --check

      - name: Release-notes consolidation gate
        run: node scripts/consolidate-release-notes.js --check

      - name: Packed-file allowlist vs .gitignore
        run: node scripts/check-pack-against-gitignore.js

      - name: Lockfile / supply-chain pin currency
        run: node scripts/pin-all.js --check

      - name: Show Node + npm version
        run: |
          node --version
          npm --version

      - name: Run smoke
        env:
          SMOKE_PARALLEL: "8"
          UV_THREADPOOL_SIZE: "16"
          SMOKE_FILE_TIMEOUT_MS: "900000"
        run: node test/smoke.js

      - name: Generate CycloneDX SBOMs (npm tree + vendored tree)
        # The npm-tree SBOM is the CycloneDX view of the runtime
        # dependency tree, generated by `npm sbom` (built in to npm 10+).
        # `--omit=dev` keeps the devDependencies installed for the smoke
        # gate out of the runtime component list, and the guard below
        # refuses the publish if a runtime dependency snuck in.
        #
        # The vendored SBOM is the higher-value artifact for downstream
        # scanners: it describes what actually ships under lib/vendor/
        # with per-file sha256 and purl.
        run: |
          set -euo pipefail
          npm sbom --sbom-format=cyclonedx --sbom-type=application --omit=dev > sbom.cdx.json
          node scripts/build-vendored-sbom.js > sbom.vendored.cdx.json
          RUNTIME_DEPS=$(node -e "
            var s = JSON.parse(require('fs').readFileSync('sbom.cdx.json', 'utf8'));
            var comps = (s.components || []).filter(function (c) {
              return c.scope !== 'optional' && c.scope !== 'excluded' &&
                     c['bom-ref'] !== s.metadata.component['bom-ref'];
            });
            console.log(comps.length);
          ")
          if [ "$RUNTIME_DEPS" -gt 0 ]; then
            echo "::error::SBOM lists $RUNTIME_DEPS runtime dependency component(s)."
            echo "::error::blamepost ships zero npm runtime dependencies. Vendor any new dependency under lib/vendor/."
            exit 1
          fi

      - name: Detect vendored bundles
        # OSV-Scanner warns rather than no-ops when a directory target
        # contains nothing scannable, so gate the directory scan on real
        # vendored content. Never silenced with a blanket allow flag,
        # which would also mute a future misconfigured scan.
        id: vendor
        run: |
          set -euo pipefail
          COUNT=$(find lib/vendor -type f ! -name 'MANIFEST.json' ! -name 'README.md' | wc -l)
          echo "vendored files: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Vulnerability scan (dev toolchain lockfile)
        # The published tarball ships zero runtime dependencies, so the
        # scannable dependency surface is the dev/build toolchain the
        # committed lockfile pins, which is exactly the supply chain
        # that runs during this publish.
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
        with:
          scan-args: |-
            --lockfile=package-lock.json

      - name: Vulnerability scan (vendored tree)
        # lib/vendor/ is the bundled-but-not-in-SBOM surface: vendored
        # code does not appear in `npm sbom` because it is not an npm
        # dependency.
        if: steps.vendor.outputs.present == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
        with:
          scan-args: |-
            --sbom=sbom.vendored.cdx.json
            -r lib/vendor/

      - name: Pack tarball (the exact bytes that will be published)
        # Reproducible build: `npm pack` stamps a fixed mtime into every
        # tar header, so re-packing the same commit is byte-identical and
        # an operator can rebuild from source and match the published
        # sha256.
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination ./dist
          ls -lh dist/

      - name: Generate the SSDF producer self-attestation (NIST SP 800-218 / OMB M-22-18)
        # Generated here, before SLSA subject computation, so the
        # attestation is itself covered by the provenance: whoever
        # verifies the provenance also verifies the attestation.
        # Deterministic from version, commit and the tagged commit's
        # author date.
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct "$COMMIT")"
          export SOURCE_DATE_EPOCH
          node scripts/generate-ssdf-attestation.js \
            --commit "$COMMIT" \
            --out    ssdf-attestation.json
          echo "[ssdf-attestation] generated (SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH)"

      - name: Compute SLSA subjects (base64-encoded sha256 of every release artifact)
        # SLSA "subjects" are the artifacts the attestation describes:
        # the tarball, both SBOMs and the SSDF attestation. The cosign
        # bundles are signatures OVER the SBOMs, and signing a signature
        # is a category error, so they are not subjects. The reusable
        # workflow expects one base64-w0 line of newline-separated
        # `<sha256>  <filename>` entries.
        id: subjects
        run: |
          set -euo pipefail
          TARBALL_PATH=$(find dist -maxdepth 1 -name '*.tgz' -type f -print -quit)
          if [ -z "$TARBALL_PATH" ] || [ ! -f "$TARBALL_PATH" ]; then
            echo "::error::No packed tarball under dist/. Refusing to continue with an unresolved tarball path."
            exit 1
          fi
          TARBALL=$(basename "$TARBALL_PATH")
          HASHES=$(
            (cd dist && sha256sum "$TARBALL") && \
            sha256sum sbom.cdx.json sbom.vendored.cdx.json ssdf-attestation.json
          )
          echo "[slsa-subjects] subjects:"
          echo "$HASHES"
          HASHES_B64=$(echo "$HASHES" | base64 -w0)
          echo "hashes=$HASHES_B64" >> "$GITHUB_OUTPUT"

      - name: Upload publish bundle (tarball + SBOMs + attestation)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: publish-bundle
          path: |
            dist/*.tgz
            sbom.cdx.json
            sbom.vendored.cdx.json
            ssdf-attestation.json
            package.json
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 1

  # Generate the SLSA L3 provenance attestation. Runs only on real tag
  # pushes (not dry runs or branch pushes), since the attestation binds
  # to the workflow_ref + tag-ref pair a downstream operator verifies.
  #
  # upload-assets is set false. The reusable workflow would otherwise
  # upload the *.intoto.jsonl straight to the GitHub release, but (a) the
  # release does not exist yet at this point in the pipeline, and (b)
  # every asset is attached atomically at release-create time so the
  # immutable-release setting can stay on. With upload-assets false the
  # attestation lands as a workflow artifact that publish-and-release
  # downloads.
  provenance:
    needs: validate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.is_tag == 'true' && !inputs.dry_run }}
    # `contents: write` is demanded by the called workflow, not used
    # here: GitHub validates every nested job's requested permissions
    # against the caller's grant when the reusable workflow resolves,
    # including the generator's upload-assets job, which declares
    # contents:write and is merely `if:`-skipped by upload-assets false.
    # Withholding the grant startup-fails the whole call. The generator
    # downgrades to contents:read in every job that actually runs.
    permissions:
      id-token: write    # OIDC token for Sigstore-keyless signing
      contents: write    # statically required by the generator's (skipped) upload-assets job
      actions: read      # introspect this workflow run for the attestation
    # IMPORTANT: tag-pinned, NOT SHA-pinned. The SLSA builder-fetch step
    # expects BUILDER_REF in `refs/tags/vX.Y.Z` form and refuses a
    # 40-hex SHA. The .pinact.yaml `ignore_actions` entry exempts this
    # single call; upstream tag protection and immutable releases
    # mitigate.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0  # zizmor: ignore[unpinned-uses] allow:slsa-framework-action-not-sha-pinned. SLSA's internal builder-fetch refuses non-tag refs; mitigated by slsa-framework's upstream tag-protection + immutable-release rules
    with:
      base64-subjects:    "${{ needs.validate.outputs.hashes }}"
      upload-assets:      false
      provenance-name:    "blamepost-${{ needs.validate.outputs.version }}.intoto.jsonl"
      # Despite the name, this input does not assert that the repository
      # is private. The generator defines it as "If true, private
      # repositories can post to the public transparency log" and passes
      # it to the builder as `allow-private-repository`, so it is a
      # permission that only a private repository is ever gated on. This
      # repository is public, the gate does not apply to it, and the
      # transparency-log entry that `slsa-verifier --source-uri` requires
      # downstream is published either way. It stays true so that a
      # misdetected visibility cannot halt the generator.
      private-repository: true
      # The SLSA workflow's `final` job ANDs every nested job's outcome,
      # including the upload-assets job deliberately skipped above. An
      # empty outcome evaluates false in that chain and the workflow
      # exits nonzero even when the generator produced the attestation
      # successfully. `continue-on-error: true` reports success
      # regardless of that computation. It also masks a REAL internal
      # generator failure, so publish-and-release never trusts this
      # job's verdict: it re-hashes the downloaded artifacts against the
      # attested subjects and runs slsa-verifier before anything is
      # published.
      continue-on-error: true

  publish-and-release:
    name: Cosign sign + create release + publish to npm
    needs: [validate, provenance]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.is_tag == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write    # gh release create + asset attach
      id-token: write    # OIDC token for npm provenance + sigstore cosign
    timeout-minutes: 20
    steps:
      - name: Set up Node 24.22.1 LTS + npm registry auth
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Download publish bundle (tarball + SBOMs + attestation)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: publish-bundle

      - name: Download SLSA provenance artifact
        # slsa-github-generator publishes the attestation as a workflow
        # artifact whose name matches `provenance-name`.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: blamepost-${{ needs.validate.outputs.version }}.intoto.jsonl

      - name: Verify the downloaded artifacts against the attested subject hashes
        # The publish bundle travels through the artifact store between
        # jobs. Recompute the sha256 of every subject with the exact
        # commands the validate job used and require byte-identical
        # output. A divergence means the bytes about to be published
        # are NOT the bytes the provenance attests, and the publish must
        # not proceed. The .sha256 and .sha3-512 sidecars written below
        # derive from these same downloaded bytes, which is what
        # entitles them to stand for the release.
        env:
          HASHES_B64: ${{ needs.validate.outputs.hashes }}
        run: |
          set -euo pipefail
          EXPECTED=$(echo "$HASHES_B64" | base64 -d)
          TARBALL=$(find dist -maxdepth 1 -name '*.tgz' -type f -print -quit)
          ACTUAL=$(
            (cd dist && sha256sum "$(basename "$TARBALL")") && \
            sha256sum sbom.cdx.json sbom.vendored.cdx.json ssdf-attestation.json
          )
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Downloaded artifacts do not match the SLSA subject hashes the validate job computed."
            echo "attested subjects:"
            echo "$EXPECTED"
            echo "downloaded artifacts:"
            echo "$ACTUAL"
            exit 1
          fi
          echo "[subject-verify] tarball + SBOMs + attestation match the attested subject hashes"

      - name: Install slsa-verifier (release binary + sha256 verify)
        # Exact version plus an inline expected sha256, mirroring the
        # zizmor install pattern: a rewritten upstream release fails
        # closed instead of executing on the publish path.
        env:
          SLSA_VERIFIER_VERSION: v2.7.1
          SLSA_VERIFIER_SHA256:  946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/slsa-verifier "https://github.com/slsa-framework/slsa-verifier/releases/download/${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64"
          ACTUAL=$(sha256sum /tmp/slsa-verifier | awk '{print $1}')
          if [ "$ACTUAL" != "$SLSA_VERIFIER_SHA256" ]; then
            echo "::error::slsa-verifier sha256 ${ACTUAL} does not match pinned ${SLSA_VERIFIER_SHA256}"
            exit 1
          fi
          sudo install -m 0755 /tmp/slsa-verifier /usr/local/bin/slsa-verifier
          slsa-verifier version

      - name: Verify the SLSA provenance against the artifacts it attests
        # The provenance job's verdict is untrustworthy by construction
        # (its `continue-on-error: true` input reports success even when
        # the generator fails internally), so the attestation is proven
        # here: slsa-verifier checks the Sigstore signature, the
        # source-repository and tag binding, and that every artifact
        # digest appears in the attested subjects. A release never ships
        # an attestation that does not verify against its own assets.
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          TARBALL=$(find dist -maxdepth 1 -name '*.tgz' -type f -print -quit)
          slsa-verifier verify-artifact "$TARBALL" \
            sbom.cdx.json sbom.vendored.cdx.json ssdf-attestation.json \
            --provenance-path "blamepost-${VERSION}.intoto.jsonl" \
            --source-uri "github.com/${GITHUB_REPOSITORY}" \
            --source-tag "v${VERSION}"
          echo "[slsa-verify] provenance verifies against the tarball, SBOMs and attestation"

      - name: Verify NPM_TOKEN is reachable
        # Fail loudly and early if the NPM_TOKEN secret is not visible
        # to this run. The publish step otherwise produces an opaque
        # ENEEDAUTH after a minute of registry churn.
        env:
          NPM_TOKEN_REACHABLE: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$NPM_TOKEN_REACHABLE" != "true" ]; then
            echo "::error::NPM_TOKEN secret is empty in this workflow run."
            echo "::error::Confirm a secret named NPM_TOKEN exists in the npm-publish environment,"
            echo "::error::that the environment's deployment-branch policy includes this tag,"
            echo "::error::and that the value is not empty or whitespace."
            exit 1
          fi
          echo "NPM_TOKEN secret is reachable."

      - name: Install cosign (sigstore-keyless)
        # Sigstore keyless signing: the workflow's OIDC token is
        # exchanged with Fulcio for a short-lived certificate bound to
        # the workflow identity, then cosign signs the SBOMs. Verifiers
        # reach for the Rekor transparency-log entry.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Cosign sign-blob the SBOMs
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle sbom.cdx.json.sigstore \
            sbom.cdx.json
          echo "[cosign-sbom] signed sbom.cdx.json; bundle at sbom.cdx.json.sigstore"

          cosign sign-blob --yes \
            --bundle sbom.vendored.cdx.json.sigstore \
            sbom.vendored.cdx.json
          echo "[cosign-sbom] signed sbom.vendored.cdx.json; bundle at sbom.vendored.cdx.json.sigstore"

      - name: Checkout source (release-notes generator, signer scripts, public key)
        # The publish bundle carries the tarball, SBOMs, package.json and
        # CHANGELOG. This job additionally needs scripts/ (the digest,
        # signing and generator scripts), release-notes/ (the structured
        # source the generator reads, either the hand-written
        # v$VERSION.json or the minor series file it was folded into) and
        # keys/release-pqc-pub.json (the public key the signer
        # cross-verifies against). Checkout MUST come before any
        # `node src/scripts/*` step.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: src

      - name: Release-digest sidecars (SHA-256 + SHA3-512)
        # Two byte-level digest sidecars for the tarball:
        #   <tarball>.sha256 is the conventional checksum operators
        #     expect on a release page; verify with `sha256sum -c`.
        #   <tarball>.sha3-512 is the PQC-first byte digest matching the
        #     rest of the release chain's hash choice; verify with
        #     `openssl dgst -sha3-512`.
        # Both are written in sha-sum-compatible `<sha>  <filename>` form.
        run: |
          set -euo pipefail
          TARBALL=$(find dist -maxdepth 1 -name '*.tgz' -type f -print -quit)
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "::error::No packed tarball under dist/. Refusing to continue with an unresolved tarball path."
            exit 1
          fi
          node src/scripts/sha3-digest.js "$TARBALL"

      - name: PQC sidecar ML-DSA-65 signature of the tarball
        # Signed with the project's own ML-DSA-65 release key. The
        # script self-verifies before writing, so a stale
        # secret-versus-committed-public-key mismatch refuses to produce
        # a non-verifiable .sig rather than shipping one.
        #
        # Conditional on the one-time release-key setup being complete:
        # run `node scripts/generate-release-signing-key.js` once, commit
        # keys/release-pqc-pub.json, and set RELEASE_PQC_SIGNING_KEY in
        # the npm-publish environment. Until then this step skips with a
        # warning and the release still ships SLSA L3 provenance,
        # Sigstore SBOM signatures and both digest sidecars; the PQC
        # signature appears on the first release after setup completes.
        id: pqc-sig
        env:
          RELEASE_PQC_SIGNING_KEY: ${{ secrets.RELEASE_PQC_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # Single-quoted printf strings so the shell does not
          # command-substitute the backticked script names in the
          # operator-recipe text.
          if [ -z "${RELEASE_PQC_SIGNING_KEY:-}" ]; then
            printf '%s\n' '::warning::RELEASE_PQC_SIGNING_KEY is empty, so the PQC sidecar is skipped.'
            printf '%s\n' '::warning::Run "node scripts/generate-release-signing-key.js" once, commit keys/release-pqc-pub.json, set the secret, and future releases pick the signature up automatically.'
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f src/keys/release-pqc-pub.json ]; then
            printf '%s\n' '::warning::src/keys/release-pqc-pub.json is missing from the checked-out source, so the PQC sidecar is skipped.'
            printf '%s\n' '::warning::The secret is set but the matching public key is not committed, so the signer self-verify would refuse the signature anyway.'
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TARBALL=$(find dist -maxdepth 1 -name '*.tgz' -type f -print -quit)
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "::error::No packed tarball under dist/. Refusing to continue with an unresolved tarball path."
            exit 1
          fi
          # The signer resolves keys/release-pqc-pub.json relative to the
          # working directory for its self-verify cross-check; link the
          # checked-out copy into place.
          ln -sfn src/keys keys
          node src/scripts/sign-release-artifact.js "$TARBALL"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Generate the release-page markdown from the structured source
        # Single source of truth: release-notes/v$VERSION.json. The
        # generator validates it against the section allowlist, the
        # title and body format rules and the operator-voice check, then
        # emits the multi-section markdown for the release page.
        id: notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node src/scripts/generate-changelog-entry.js "$VERSION" --release-page > release-notes.md
          BYTE_COUNT=$(wc -c < release-notes.md | tr -d ' ')
          if [ "$BYTE_COUNT" -lt 64 ]; then
            echo "::error::The generator produced an unexpectedly small release page (${BYTE_COUNT} bytes)."
            echo "::error::Inspect the v${VERSION} release notes. They likely validated through with every section empty."
            exit 1
          fi
          echo "[release-notes] generated ${BYTE_COUNT} bytes of release-page markdown for v${VERSION}"
          echo "--- release-notes.md (first 20 lines) ---"
          head -20 release-notes.md
          echo "---"

      - name: Create the signed release with all assets atomically
        # The workflow is authoritative for release creation and refuses
        # to overwrite an existing release: if one exists for this tag,
        # that is an integrity signal (a duplicate run, or a manual
        # create). Fail loudly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      v${{ needs.validate.outputs.version }}
          VERSION:  ${{ needs.validate.outputs.version }}
          PQC_AVAILABLE: ${{ steps.pqc-sig.outputs.available }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; this workflow is authoritative for release creation."
            echo "::error::Delete it with 'gh release delete $TAG' and re-run, or push a new tag."
            exit 1
          fi
          TARBALL=$(find dist -maxdepth 1 -name '*.tgz' -type f -print -quit)
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "::error::No packed tarball under dist/. Refusing to create a release with an unresolved tarball path."
            exit 1
          fi
          # The title comes from the structured release notes' `headline`
          # field, read through the generator rather than from a fixed
          # path: a released version lives in the minor series file
          # release-notes/v<minor>.x.json once it has been folded, and
          # only the generator knows which of the two shapes currently
          # holds it. Its separator is an owned format string rather than
          # prose: scripts/release.js builds the release commit subject
          # to the same shape and matches HEAD against it to detect a
          # resumed release.
          # allow:dash-punctuation-in-prose release-title format string
          # Shape: `vX.Y.Z — <headline>`.
          HEADLINE=$(node src/scripts/generate-changelog-entry.js "$VERSION" --headline)
          if [ -n "$HEADLINE" ]; then
            # allow:dash-punctuation-in-prose release-title format string
            TITLE="$TAG — $HEADLINE"
          else
            TITLE="$TAG"
          fi
          ASSETS=(
            "$TARBALL"
            "${TARBALL}.sha256"
            "${TARBALL}.sha3-512"
            sbom.cdx.json sbom.cdx.json.sigstore
            sbom.vendored.cdx.json sbom.vendored.cdx.json.sigstore
            "blamepost-${VERSION}.intoto.jsonl"
            ssdf-attestation.json
          )
          if [ "$PQC_AVAILABLE" = "true" ]; then
            ASSETS+=("${TARBALL}.mldsa.sig")
            echo "[release-create] assets: tarball + 2 digest sidecars + 2 SBOMs + 2 cosign bundles + provenance + SSDF attestation + ML-DSA signature"
          else
            echo "[release-create] assets: tarball + 2 digest sidecars + 2 SBOMs + 2 cosign bundles + provenance + SSDF attestation (PQC signature skipped, as the warning above explains)"
          fi
          echo "[release-create] title: $TITLE"
          gh release create "$TAG" \
            "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file release-notes.md
          echo "[release-create] release $TAG created with the full asset bundle"

      - name: Verify the npm registry signing chain
        # `npm audit signatures` verifies the signing chain for every
        # package in the install tree against the registry's public
        # keys. blamepost ships zero runtime dependencies, so the tree is
        # trivially empty today and this is regression defense: the
        # first runtime dependency added gets checked before it can
        # publish. Invariant-driven (dependency count), not
        # error-message-driven.
        run: |
          set +e
          RUNTIME_DEP_COUNT=$(node -e "console.log(Object.keys(require('./package.json').dependencies || {}).length)" 2>/dev/null || echo 0)
          if [ "$RUNTIME_DEP_COUNT" = "0" ]; then
            echo "[npm-audit-signatures] zero runtime dependencies, so the invariant holds. The gate is armed for the first one added."
            exit 0
          fi
          OUT=$(npm audit signatures --omit dev 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ "$STATUS" -eq 0 ]; then
            echo "[npm-audit-signatures] registry signing chain verified for $RUNTIME_DEP_COUNT runtime dependency(ies)"
            exit 0
          fi
          echo "::error::npm audit signatures failed. Runtime dependencies exist but could not be verified against the registry signing chain"
          exit "$STATUS"

      - name: Publish to npm (with SLSA provenance)
        # `npm publish <tarball>` publishes the EXACT bytes the validate
        # job packed and scanned. Provenance is generated against this
        # run's context. The leading `./` is load-bearing, because
        # without it npm 10+ mis-classifies a relative path containing
        # `/` as a git spec.
        run: |
          set -euo pipefail
          TARBALL=$(find dist -maxdepth 1 -name '*.tgz' -type f -print -quit)
          # An empty result here would be the worst fail-open on the
          # release path: `npm publish "./"` publishes the WORKING
          # DIRECTORY as the package, with this run's provenance attached
          # to it. Refuse instead.
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "::error::No packed tarball under dist/. Refusing to publish. The publish bundle did not download, and './' is not a substitute for it."
            exit 1
          fi
          echo "Publishing: $TARBALL"
          npm publish "./${TARBALL}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  summary:
    name: Build summary
    needs: [validate, provenance, publish-and-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Render the outcome table
        env:
          IS_TAG:            ${{ needs.validate.outputs.is_tag || 'false' }}
          VERSION:           ${{ needs.validate.outputs.version || 'unknown' }}
          DRY_RUN:           ${{ inputs.dry_run || 'false' }}
          VALIDATE_RESULT:   ${{ needs.validate.result }}
          PROVENANCE_RESULT: ${{ needs.provenance.result }}
          PUBLISH_RESULT:    ${{ needs.publish-and-release.result }}
        run: |
          {
            echo "### npm publish"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Package**           | \`@blamejs/blamepost\` |"
            echo "| **Version**           | \`${VERSION}\` |"
            echo "| **Tag push**          | ${IS_TAG} |"
            echo "| **Dry run**           | ${DRY_RUN} |"
            echo "| **Validate job**      | ${VALIDATE_RESULT} |"
            echo "| **SLSA provenance**   | ${PROVENANCE_RESULT} |"
            echo "| **Publish + release** | ${PUBLISH_RESULT} |"
            echo "| **Registry**          | https://registry.npmjs.org |"
            if [ "$IS_TAG" = "true" ] && [ "$DRY_RUN" != "true" ] && [ "$PUBLISH_RESULT" = "success" ]; then
              echo "| **Provenance (npm)**  | https://www.npmjs.com/package/@blamejs/blamepost/v/${VERSION} |"
              echo "| **GitHub release**    | https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION} |"
            fi
            echo ""
            echo "Install with:"
            echo ""
            echo '```bash'
            echo "npm install @blamejs/blamepost@${VERSION}"
            echo '```'
            if [ "$IS_TAG" = "true" ] && [ "$DRY_RUN" != "true" ] && [ "$PUBLISH_RESULT" = "success" ]; then
              echo ""
              echo "Verify the SLSA provenance:"
              echo ""
              echo '```bash'
              echo "gh release download v${VERSION} --repo ${GITHUB_REPOSITORY}"
              echo "slsa-verifier verify-artifact blamejs-blamepost-${VERSION}.tgz \\"
              echo "  --provenance-path blamepost-${VERSION}.intoto.jsonl \\"
              echo "  --source-uri github.com/${GITHUB_REPOSITORY} \\"
              echo "  --source-tag v${VERSION}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
