name: ClusterFuzzLite batch fuzzing

# Deep continuous fuzzing on a daily schedule. Each target runs for 30
# minutes, long enough to explore paths the 60-second pull-request
# budget cannot reach. Findings upload as crash artifacts.
#
# See cflite_pr.yml for why jazzer.js is invoked directly instead of
# through the ClusterFuzzLite v1 action wrapper, how the harness set is
# discovered, which harnesses run under --sync, what the per-target
# dictionary carries, and what a finding looks like.

on:
  schedule:
    - cron: '17 5 * * *'   # daily 05:17 UTC
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Per-target fuzz budget (seconds)'
        required: false
        default: '1800'

permissions:
  contents: read

concurrency:
  group: cflite-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover fuzz harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.harnesses.outputs.targets }}
      any:     ${{ steps.harnesses.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enumerate fuzz/*.fuzz.js
        id: harnesses
        run: |
          set -euo pipefail
          # The harness set is discovered rather than listed, so a new
          # fuzz/<name>.fuzz.js runs with no workflow edit. Finding none is a
          # refusal rather than a pass whenever .clusterfuzzlite/ is present,
          # since that directory is what configures fuzzing. The count is
          # published on every run, passing or failing.
          if [ ! -d fuzz ]; then
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "EXAMINED 0 fuzz-harnesses"
            if [ -d .clusterfuzzlite ]; then
              echo "REFUSED: .clusterfuzzlite/ configures fuzzing and fuzz/ is absent."
              exit 1
            fi
            echo "No fuzz/ directory, so there is nothing to fuzz."
            exit 0
          fi
          TARGETS=$(find fuzz -maxdepth 1 -name '*.fuzz.js' -type f -printf '%f\n' \
            | sed 's/\.fuzz\.js$//' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          COUNT=$(printf '%s' "$TARGETS" | jq 'length')
          case "$COUNT" in
            ''|*[!0-9]*)
              echo "REFUSED: the harness count could not be read."
              exit 1
              ;;
          esac
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "EXAMINED $COUNT fuzz-harnesses"
          if [ "$COUNT" -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            if [ -d .clusterfuzzlite ]; then
              echo "REFUSED: .clusterfuzzlite/ configures fuzzing and fuzz/ carries no *.fuzz.js harness."
              exit 1
            fi
            echo "fuzz/ carries no *.fuzz.js harness yet."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "Harnesses: $TARGETS"
          fi

  fuzz:
    name: ClusterFuzzLite batch ${{ matrix.target }}
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24.22.1 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Install jazzer.js
        run: npm ci --prefix fuzz

      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_TIME: ${{ inputs.fuzz_seconds || '1800' }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          harness="fuzz/${TARGET}.fuzz.js"
          corpus="fuzz/${TARGET}_seed_corpus"
          dict="fuzz/${TARGET}.dict"
          corpus_args=()
          if [ -d "$corpus" ]; then corpus_args+=("$corpus"); fi
          libfuzzer_args=(-max_total_time="$FUZZ_TIME" -error_exitcode=1 -timeout=30)
          if [ -f "$dict" ]; then libfuzzer_args+=(-dict="$dict"); fi
          # cflite_pr.yml says what the mode is and why it is asked per
          # harness.
          mode="$(node fuzz/run-once.js --mode "$TARGET")"
          case "$mode" in
            sync)  mode_args=(--sync) ;;
            async) mode_args=() ;;
            *)
              echo "REFUSED: run-once.js --mode $TARGET printed '$mode', not sync or async."
              exit 1
              ;;
          esac
          echo "::group::jazzer fuzz $harness ($FUZZ_TIME s, $mode)"
          npx --prefix fuzz jazzer "${mode_args[@]}" "$harness" "${corpus_args[@]}" -- \
            "${libfuzzer_args[@]}"
          echo "::endgroup::"

      - name: Upload crash artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-batch-crash-${{ matrix.target }}
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore
