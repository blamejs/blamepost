name: ClusterFuzzLite PR fuzzing

# Coverage-guided fuzzing via jazzer.js + libFuzzer against every
# `fuzz/*.fuzz.js` harness on each pull request that touches the mail
# stack or the harnesses themselves. The wire-protocol readers parse
# bytes an unauthenticated stranger controls, which is where every
# parser CVE in this product category has come from. Those readers are
# SMTP, IMAP, JMAP, POP3, ManageSieve and MIME.
#
# jazzer.js is invoked directly rather than through the
# google/clusterfuzzlite/actions/build_fuzzers wrapper: the wrapper's v1
# image refuses to fuzz JavaScript projects (it rejects both a real
# sanitizer and an empty one for JS). The .clusterfuzzlite/ directory
# stays the canonical integration spec: what an OSS-Fuzz submission
# mirrors, what OpenSSF Scorecard's Fuzzing check detects, and what
# would re-engage if a JS fix ships upstream.
#
# Findings: the step fails with the reproducer printed inline, both as
# hex and as base64, and the libFuzzer crash artifact lands at `crash-*`
# in the workspace and uploads on failure. `-error_exitcode=1` sets the
# code for a libFuzzer-detected failure; an uncaught exception from the
# harness exits 77 instead, which is jazzer's own code for one. Either
# way the step fails, and `node fuzz/run-once.js <target> @crash-<hash>`
# replays the artifact under plain Node for a stack trace.
#
# `--sync` is passed to every harness that returns a value. A harness that
# returns a promise carries the line `module.exports.async = true;`, and
# `node fuzz/run-once.js --mode <target>` reads that line and prints sync
# or async. Under --sync jazzer does not wait for a returned promise, so a
# rejection from an asynchronous harness would never be reported.
# .clusterfuzzlite/build.sh asks the same question the same way.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    # The harness set is read from the tree rather than duplicated as a
    # hand-maintained matrix: a new `fuzz/<name>.fuzz.js` is fuzzed from
    # the commit that adds it, and a removed one stops being scheduled,
    # with no second list to keep in agreement.
    name: Discover fuzz harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.harnesses.outputs.targets }}
      any:     ${{ steps.harnesses.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enumerate fuzz/*.fuzz.js
        id: harnesses
        run: |
          set -euo pipefail
          # The harness set is discovered rather than listed, so a new
          # fuzz/<name>.fuzz.js runs with no workflow edit. Finding none is a
          # refusal rather than a pass whenever .clusterfuzzlite/ is present,
          # since that directory is what configures fuzzing. The count is
          # published on every run, passing or failing.
          if [ ! -d fuzz ]; then
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "EXAMINED 0 fuzz-harnesses"
            if [ -d .clusterfuzzlite ]; then
              echo "REFUSED: .clusterfuzzlite/ configures fuzzing and fuzz/ is absent."
              exit 1
            fi
            echo "No fuzz/ directory, so there is nothing to fuzz."
            exit 0
          fi
          TARGETS=$(find fuzz -maxdepth 1 -name '*.fuzz.js' -type f -printf '%f\n' \
            | sed 's/\.fuzz\.js$//' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          COUNT=$(printf '%s' "$TARGETS" | jq 'length')
          case "$COUNT" in
            ''|*[!0-9]*)
              echo "REFUSED: the harness count could not be read."
              exit 1
              ;;
          esac
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "EXAMINED $COUNT fuzz-harnesses"
          if [ "$COUNT" -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            if [ -d .clusterfuzzlite ]; then
              echo "REFUSED: .clusterfuzzlite/ configures fuzzing and fuzz/ carries no *.fuzz.js harness."
              exit 1
            fi
            echo "fuzz/ carries no *.fuzz.js harness yet."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "Harnesses: $TARGETS"
          fi

  fuzz:
    name: ClusterFuzzLite ${{ matrix.target }}
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24.22.1 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Install jazzer.js
        run: npm ci --prefix fuzz

      - name: Fuzz ${{ matrix.target }}
        env:
          # 60s per target on a pull request. cflite_batch.yml runs the
          # deeper daily schedule that reaches paths this budget cannot.
          FUZZ_TIME: '60'
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          harness="fuzz/${TARGET}.fuzz.js"
          corpus="fuzz/${TARGET}_seed_corpus"
          dict="fuzz/${TARGET}.dict"
          # The seed corpus goes in as a positional argument when
          # present; libFuzzer treats a directory argument as corpus
          # inputs.
          corpus_args=()
          if [ -d "$corpus" ]; then corpus_args+=("$corpus"); fi
          # The dictionary carries the CR and LF sequences the curated
          # corpus cannot. A seed is a text file, and CR is the one byte
          # an editor rewrites on the way to disk, so each seed holds one
          # command with no terminator and the wire framing comes from
          # here. Every guard's bare-CR and bare-LF refusal and the
          # DATA-body smuggling detector are defined on those bytes, so
          # without the dictionary that whole family is unreachable.
          libfuzzer_args=(-max_total_time="$FUZZ_TIME" -error_exitcode=1 -timeout=30)
          if [ -f "$dict" ]; then libfuzzer_args+=(-dict="$dict"); fi
          mode="$(node fuzz/run-once.js --mode "$TARGET")"
          case "$mode" in
            sync)  mode_args=(--sync) ;;
            async) mode_args=() ;;
            *)
              echo "REFUSED: run-once.js --mode $TARGET printed '$mode', not sync or async."
              exit 1
              ;;
          esac
          echo "::group::jazzer fuzz $harness ($FUZZ_TIME s, $mode)"
          npx --prefix fuzz jazzer "${mode_args[@]}" "$harness" "${corpus_args[@]}" -- \
            "${libfuzzer_args[@]}"
          echo "::endgroup::"

      - name: Upload crash artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore
