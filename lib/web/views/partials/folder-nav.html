<nav class="folders" aria-label="Folders">
  <a class="compose-cta" href="/compose">Write a message</a>
  <ul class="folder-list">
    {% for f in folders %}
    <li>
      <a class="folder-link{% if f.current %} is-current{% endif %}" href="/{{ f.href }}"
         {% if f.current %}aria-current="page"{% endif %}>{{ f.label }}</a>
    </li>
    {% endfor %}
  </ul>
</nav>
